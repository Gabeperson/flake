[bar]
scale = 0.7
background-opacity = 90
# none,sm,md,lg,full
rounding = "md"
button-label-size = 1.3
button-label-weight = "normal"
button-label-padding = 0.7
button-icon-padding = 0.7

[[bar.layout]]
monitor = "*"
left = ["dashboard", "niri-workspaces", "cpu", "ram", "netstat", "storage"]
center = ["clock",
#"world-clock",
"idle-inhibit"]
right = [
  "media",
  "cava",
  "keyboard-input",
  "systray",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "microphone",
  "battery",
  "brightness",
  "power"
]

# Custom icon sources
# from https://wayle.app/guide/custom-icons
# tb-/tbf- https://tabler.io/icons
# md- https://fonts.google.com/icons
# ld- https://lucide.dev/icons/

[osd]
# position = "top-right"

[modules.cpu]
thresholds = [
  { above = 70, icon-color = "status-warning", label-color = "status-warning" },
  { above = 90, icon-color = "status-error", label-color = "status-error" },
]

[modules.ram]
thresholds = [
  { above = 70, icon-color = "status-warning", label-color = "status-warning" },
  { above = 90, icon-color = "status-error", label-color = "status-error" },
]

[modules.clock]
format = "%a, %b %d, %Y, %I:%M:%S %P"

[modules.world-clock]
format = "{{tz('Asia/Seoul', '%H:%M %Z')}}"

[modules.idle-inhibit]
format = "{{state}} ({{remaining}})"

[modules.battery]
thresholds = [
  { below = 40, icon-color = "status-warning", label-color = "status-warning" },
  { below = 20, icon-color = "status-error", label-color = "status-error" },
]

